<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Засіб — Besti</title>
  <meta name="theme-color" content="#FBF8F4">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="product">
  <div id="site-header"></div>

  <main>
    <section class="page-head" style="padding-bottom:0">
      <div class="container"><nav class="crumbs" id="crumbs" aria-label="Хлібні крихти"></nav></div>
    </section>

    <section class="container product" id="product"></section>

    <section class="section section--cream" id="pairs-wrap">
      <div class="container slider" id="pairs">
        <div class="section-head">
          <div>
            <span class="eyebrow">Ритуал догляду</span>
            <h2>З цим засобом <em>поєднують</em></h2>
          </div>
          <div class="slider__nav">
            <button class="round-btn" data-prev aria-label="Назад" data-icon="arrowL"></button>
            <button class="round-btn" data-next aria-label="Вперед" data-icon="arrow"></button>
          </div>
        </div>
        <div class="slider__track"></div>
        <div class="slider__progress"><span></span></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/leads.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/product.js"></script>
</body>
</html>
